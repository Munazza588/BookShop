<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="outer-most-div">
            <div class="outer-div">
                <div class="bookCards">
            </div>
            <button id="openFormBtn" class="newBook">New Book</button>
            </div>
            <dialog class="form-div" id="myDialog">
                <form id="bookForm" method="dialog">
                <input type="text" id="titleInput" placeholder="Title" required>
                <input type="text" id="authorInput" placeholder="Author" required>
                <input type="number" id="pageInput" placeholder="Pages" required>
                <button type="submit" class="submit">Submit</button>

                </form>
            </dialog>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
